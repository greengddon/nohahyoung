<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html구조연습part.2</title>

    <style>
        div{
            width: 300px;
            height: 200px;
            background-color: burlywood;
            border: 1px;
            border-color: black;
            border-style: solid;
            font-size: 50px;
            color: white;
            text-align: center;
            line-height: 200px;
            border-radius: 10px 0px 60px 0px;
        }
        .aa{
            background-color: aqua;
        }
        .bb{
            background-color: rgb(248, 69, 57);
        }
    </style>
</head>
<body>
    <div>1</div>
    <div>2</div>
    <div class="aa">3</div>
    <div>4</div>
    <div>5</div>
    <div class="bb">3</div>
</body>
</html>
