<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            background-color: rgb(116, 194, 136);
            font-family: "궁서", sans-serif;
        }

        .header{
            background-color: aqua;
            color: azure;
            padding: 30px;/* 안쪽 여백 */
            text-align: center;
        }

        .menu {
            background-color: blueviolet;
            padding: 20px;
            text-align: center;
        }

        .menu a{
            color: black;/* 링크한 문자에 컬러 변경하기 */
            text-decoration: none; /* 링크한 문자에 밑줄 없애기 */
            margin: 20px;
            /* 메뉴 박스 안에 있는 글자 a에 대하여 */
        }

        .menu a:hover{/* 마우스를 올렸을때 변하는 액션값 */
            color: rgb(171, 236, 66)
        }

        .content{
            max-width: 1200px;
            margin: 30px auto;/*위아래는 30px, auto좌우는 가운데 정렬 */
            padding: 30px;/* 안쪽여백 */
            background-color: azure;
            text-align: center;/* 문자 가운데 정렬 */
        }

        .content img{
            width: 100%; /* 이미지 사이즈 위 콘텐츠 박스 크기에 맞춰서 100% 채우기 */
        }

        .button{
            display: inline-block;/* 문자 외형을 박스로 인식해라 */
            background-color: black;/* 박스 배경색 */
            color: white;/* 박스 안 문자색 */
            padding: 12px 30px;/* 박스 안에 여백 주어 문자가 여유있게 보이도록 설정 */
            text-decoration: none;/* 링크상 생기는 밑줄 없애기 */
        }

        .button:hover{
            background-color: orange;/* 마우스를 hover하면 주황색이 됨 */
        }

        footer{
            background-color: cadetblue;
            color: aqua;
            padding: 20px;
            text-align: center;
        }

    </style>
</head>
<body>
    <div class="header"> 
        <h1>my web page</h1>
        <p>나의 첫 번째 웹 페이지 입니다.</p>
    </div>

    <div class="menu">
        <a href="https://www.naver.com/">네이버</a>
        <a href="https://www.google.com/" target="_blank">구글</a>
    </div>

    <div class="content">
        <h2>안녕하세요</h2>
        <p>웹페이지로 들어갈 수 있어요</p>
        <img src="img/gg.jpg" alt="구글도 있어요.">
        <a href="https://www.google.com/" target="_blank" class="button">바로가기</a>
    </div>

    <div>
        <p>Copyright 2026. All Rights Reserved.</p>
    </div>

</body>
</html>
